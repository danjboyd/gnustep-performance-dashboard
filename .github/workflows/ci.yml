name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (clang, libobjc2)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PREFIX: ${{ github.workspace }}/out/ci-gnustep
    steps:
      - uses: actions/checkout@v4

      - name: Release assembly and toolchain cache guards
        run: |
          python3 Tests/release-assembly-checks.py
          python3 Tests/toolchain-fetch-checks.py
          python3 Tests/windows-source-inventory-checks.py

      - name: Install packages
        run: |
          sudo apt-get -q update
          sudo apt-get -q -y install clang lld cmake ninja-build pkg-config xvfb xdotool x11-apps \
            libffi-dev libgnutls28-dev libxml2-dev libxslt1-dev libicu-dev zlib1g-dev \
            libcurl4-gnutls-dev libjpeg-dev libtiff-dev libpng-dev \
            libcairo2-dev libfreetype-dev libfontconfig-dev \
            libx11-dev libxext-dev libxft-dev libxrender-dev libxt-dev libxmu-dev \
            libunwind8 python3 libglib2.0-dev imagemagick

      - name: Cache GNUstep
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PREFIX }}
          key: gnustep-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('.github/scripts/install-gnustep.sh') }}

      - name: Build GNUstep and tools-xctest
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/install-gnustep.sh

      - name: Build
        run: |
          . "$PREFIX/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="$PREFIX/System/Library/Libraries${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          make CC=clang

      - name: make check
        run: |
          . "$PREFIX/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="$PREFIX/System/Library/Libraries${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          sh Tests/run.sh

      - name: GCC and Clang recording compatibility
        run: |
          . "$PREFIX/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="$PREFIX/System/Library/Libraries${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          bash Tests/compiler-checks.sh

      - name: Investigation controllers and Analysis menus under both themes
        run: |
          . "$PREFIX/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="$PREFIX/System/Library/Libraries${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          bash .github/scripts/install-investigation-themes.sh
          sh Tests/investigation-gui-checks.sh

      - name: Keep investigation screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investigation-gui
          path: Tests/out/investigations
          if-no-files-found: ignore
          retention-days: 7

      - name: Portable trace fixtures and native capture
        run: |
          . "$PREFIX/System/Library/Makefiles/GNUstep.sh"
          export LD_LIBRARY_PATH="$PREFIX/System/Library/Libraries${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 Tests/trace-portability.py --gstrace Tools/gstrace/obj/gstrace --synthetic
          python3 Tests/trace-portability.py --gstrace Tools/gstrace/obj/gstrace \
            --capture Tests/out/cburn.gstrace --output Tests/out/native-linux

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-trace
          path: Tests/out/native-linux
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: linux-trace-reader
          path: |
            Tools/gstrace/obj/gstrace
            GSPerformance/obj/libGSPerformance.so*
          retention-days: 7

      - name: Keep test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            Tests/out/*.txt
            Tests/out/*.log
            Tests/out/gui-*
          if-no-files-found: ignore

  windows:
    needs: linux
    name: Windows (MSYS2 clang64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            make
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-libobjc2
            mingw-w64-clang-x86_64-libdispatch
            mingw-w64-clang-x86_64-gnustep-make
            mingw-w64-clang-x86_64-gnustep-base
            mingw-w64-clang-x86_64-gnustep-gui
            mingw-w64-clang-x86_64-gnustep-back

      # MSYS2's gnustep-base 1.31.1-10 puts __block on an instance variable,
      # which newer clang rejects (gnustep/libs-base#809).
      - name: Patch gnustep-base header
        run: |
          sed -i 's/BLOCK_SCOPE GSScheduledBlock _block;/GSScheduledBlock _block;/' \
            /clang64/include/Foundation/NSBackgroundActivityScheduler.h

      - name: Build and install tools-xctest
        run: |
          . /clang64/share/GNUstep/Makefiles/GNUstep.sh
          export ADDITIONAL_CPPFLAGS=-DHAVE_MODE_T
          git clone -q --depth 1 --branch v0.5.1 https://github.com/danjboyd/tools-xctest.git "$RUNNER_TEMP/tools-xctest"
          make -C "$RUNNER_TEMP/tools-xctest"
          make -C "$RUNNER_TEMP/tools-xctest" install

      - name: Build (framework, gstrace, PerformanceDashboard.app)
        run: |
          . /clang64/share/GNUstep/Makefiles/GNUstep.sh
          export ADDITIONAL_CPPFLAGS=-DHAVE_MODE_T
          make

      - name: Unit tests
        run: |
          . /clang64/share/GNUstep/Makefiles/GNUstep.sh
          export ADDITIONAL_CPPFLAGS=-DHAVE_MODE_T
          export PATH="$PWD/GSPerformance/obj:$PATH"
          make -C Tests/Unit check

      - name: Viewer checks on a trace recorded on Linux
        run: |
          . /clang64/share/GNUstep/Makefiles/GNUstep.sh
          export PATH="$PWD/GSPerformance/obj:$PATH"
          sh Tests/viewer-checks.sh "$PWD/Tools/gstrace/obj/gstrace.exe"

      - name: Recording checks
        run: |
          . /clang64/share/GNUstep/Makefiles/GNUstep.sh
          export PATH="$PWD/GSPerformance/obj:$PWD/Runtime/obj:$PATH"
          sh Tests/windows-checks.sh

      - uses: actions/download-artifact@v4
        with:
          name: native-linux-trace
          path: Tests/out/native-linux

      - name: Cross-platform trace acceptance
        run: |
          . /clang64/share/GNUstep/Makefiles/GNUstep.sh
          export PATH="$PWD/GSPerformance/obj:$PWD/Runtime/obj:$PATH"
          python Tests/trace-portability.py --gstrace Tools/gstrace/obj/gstrace.exe --synthetic
          python Tests/trace-portability.py --gstrace Tools/gstrace/obj/gstrace.exe --verify Tests/out/native-linux
          python Tests/trace-portability.py --gstrace Tools/gstrace/obj/gstrace.exe \
            --capture Tests/out/spin.gstrace --output Tests/out/native-windows

      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-trace
          path: Tests/out/native-windows
          retention-days: 7

      - name: Keep Windows test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-output
          path: Tests/out
          if-no-files-found: ignore

  windows-trace-on-linux:
    name: Read native Windows trace on Linux
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PREFIX: ${{ github.workspace }}/out/ci-gnustep
    steps:
      - uses: actions/checkout@v4
      - name: Reader runtime dependencies
        run: |
          sudo apt-get -q update
          sudo apt-get -q -y install libgnutls28-dev libxml2-dev libxslt1-dev libicu-dev libcurl4-gnutls-dev
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.PREFIX }}
          key: gnustep-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('.github/scripts/install-gnustep.sh') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: linux-trace-reader
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-trace
          path: Tests/out/native-windows
      - name: Compare native Windows summary and exports
        run: |
          chmod +x Tools/gstrace/obj/gstrace
          export LD_LIBRARY_PATH="$PWD/GSPerformance/obj:$PREFIX/System/Library/Libraries"
          python3 Tests/trace-portability.py --gstrace Tools/gstrace/obj/gstrace --verify Tests/out/native-windows
