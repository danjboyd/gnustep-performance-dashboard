# Release builds on GitHub's runners (docs/release.md): the Linux AppImage on
# Debian 13 (scripts/ci-release-linux.sh) and the Windows MSI through
# gnustep-packager's reusable workflow, from the inputs pinned in
# packaging/release-inputs.json. The result is a workflow artifact,
# "release", with SHA256SUMS. Nothing is signed, tagged or published: every
# tag and publish needs Dan's approval.
name: Release

on:
  push:
    tags: ["v*"]
    # A branch that changes how releases are built (release/...) runs it
    # too, as package.version, so the workflow is tested before it is merged.
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package instead of package.version (a release candidate such as 0.1.0-rc1)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          manifest="$(python3 -c 'import json; print(json.load(open("packaging/package.manifest.json"))["package"]["version"])')"
          version="${VERSION:-$manifest}"
          case "$GITHUB_REF" in
            refs/tags/v*)
              # A tag names the version (v0.1.0-rc1 packages 0.1.0-rc1); its
              # base must be package.version.
              version="${GITHUB_REF#refs/tags/v}"
              [ "${version%%-*}" = "$manifest" ] || {
                echo "::error::tag ${GITHUB_REF#refs/tags/} is not package.version $manifest"; exit 1; }
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Performance Dashboard $version from ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 90
    steps:
      - name: Packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git make gcc libc6-dev pkg-config python3 sudo file binutils \
            libx11-dev libxext-dev libxft-dev libxrender-dev libfreetype-dev \
            libfontconfig-dev libcairo2-dev libglib2.0-dev \
            xvfb xauth x11-utils fonts-dejavu-core \
            squashfs-tools desktop-file-utils

      - uses: actions/checkout@v4

      # The container runs as root on a workspace the runner's user owns; the
      # scripts read the commit with git.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Package and check
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/ci-release-linux.sh "$VERSION"

      - name: Check results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import glob, json
          for path in glob.glob("dist/ci/linux/*.provenance.json"):
              p = json.load(open(path))
              print("Linux checks: " + ", ".join("%s %s" % kv for kv in p["checks"].items()))
              print("")
              print("Build IDs: " + ", ".join("%s %s" % kv for kv in p["buildIds"].items()))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/ci/linux
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-logs
          path: dist/logs
          if-no-files-found: warn

  windows:
    needs: version
    # The pinned gnustep-packager (packaging/release-inputs.json): the
    # gnustep-cli-new toolchain on windows-latest, then the manifest's
    # Windows build and stage (scripts/package-*-windows.ps1), the MSI, its
    # validation and a smoke launch.
    uses: danjboyd/gnustep-packager/.github/workflows/package-gnustep-app.yml@362f270baf442c57f0736522530b82dd6a164e2e
    with:
      manifest-path: packaging/package.manifest.json
      backend: msi
      package-version: ${{ needs.version.outputs.version }}
      packager-repository: danjboyd/gnustep-packager
      packager-ref: 362f270baf442c57f0736522530b82dd6a164e2e
      run-validation: true
      run-smoke: true
      artifact-name: windows

  release:
    needs: [version, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist/ci/release

      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: dist/ci/windows

      - name: Collect and SHA256SUMS
        run: |
          find dist/ci/windows -name '*.msi' -exec cp {} dist/ci/release/ \;
          ls dist/ci/release/*.msi >/dev/null || { echo "::error::no MSI in the windows artifact"; exit 1; }
          (cd dist/ci/release && sha256sum -- *.AppImage *.msi > SHA256SUMS)
          {
            echo '```'
            cat dist/ci/release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/ci/release
          if-no-files-found: error
