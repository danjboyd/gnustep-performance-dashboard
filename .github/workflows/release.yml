# Unsigned Linux producer only. Pushes/tags cannot access real signing secrets.
# Windows remains experimental and is exercised by the ordinary CI workflow.
name: Release

on:
  push:
    tags: ["v*"]
    # A branch that changes how releases are built (release/...) runs it
    # too, as package.version, so the workflow is tested before it is merged.
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package instead of package.version (a release candidate such as 0.1.0-rc1)"
        required: false
        default: ""

permissions:
  contents: read
  # No secrets are passed or referenced; signing requires a separate manual workflow.

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      producer: ${{ steps.version.outputs.producer }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 .github/scripts/release-selection.py \
            --ref "$GITHUB_REF" --version "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Summarize selected unsigned producer
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRODUCER: ${{ steps.version.outputs.producer }}
        run: echo "Performance Dashboard $VERSION ($PRODUCER) from ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

  linux-managed:
    if: needs.version.outputs.producer == 'managed'
    needs: version
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 90
    steps:
      - name: Packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git make gcc libc6-dev pkg-config python3 sudo file binutils openssl libunwind8 \
            libx11-dev libxext-dev libxft-dev libxrender-dev libfreetype-dev \
            libfontconfig-dev libcairo2-dev libglib2.0-dev \
            xvfb xauth x11-utils fonts-dejavu-core \
            squashfs-tools desktop-file-utils bubblewrap

      - uses: actions/checkout@v4

      # The container runs as root on a workspace the runner's user owns; the
      # scripts read the commit with git.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Package and check
        env:
          VERSION: ${{ needs.version.outputs.version }}
          UPDATE_ED_PUBLIC_KEY: ${{ vars.UPDATE_ED_PUBLIC_KEY }}
        run: scripts/ci-release-linux.sh "$VERSION"

      - name: Check results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import glob, json
          for path in glob.glob("dist/ci/linux/*.provenance.json"):
              p = json.load(open(path))
              print("Linux checks: " + ", ".join("%s %s" % kv for kv in p["checks"].items()))
              print("")
              print("Build IDs: " + ", ".join("%s %s" % kv for kv in p["buildIds"].items()))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/ci/linux
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-logs
          path: dist/logs
          if-no-files-found: warn

  linux-custom:
    if: needs.version.outputs.producer == 'custom-csd'
    needs: version
    uses: ./.github/workflows/csd-review.yml
    with:
      version: ${{ needs.version.outputs.version }}
      mode: production
