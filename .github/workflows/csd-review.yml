# Source-only implementation until Dan approves an exact future dispatch.
name: Custom CSD unsigned producer
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.version for production; -review or -review.N for review
        required: true
        default: 0.1.8-review
      mode:
        description: Explicit unsigned producer mode; production must equal package.version
        type: choice
        options: [review, production]
        default: review
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      mode:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: csd-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-csd-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CSD_VERSION: ${{ inputs.version }}
      CSD_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate explicit unsigned producer mode before any acquisition
        run: python3 .github/scripts/release-selection.py --custom-mode "$CSD_MODE" --version "$CSD_VERSION"
      - name: Verify combined application inputs before builder fetch or cache use
        run: |
          review_inputs=$(python3 .github/scripts/release-selection.py --custom-mode "$CSD_MODE" --version "$CSD_VERSION" --review-inputs)
          python3 scripts/check-csd-package.py review-inputs "$review_inputs"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: danjboyd/gnustep-cli-new
          ref: 4d5504bbedf076f824c952f4ab198d09547c8c3c
          path: out/csd-ci/builder
          persist-credentials: false
      - name: Preserve immutable builder blob bytes before identity checks
        run: |
          builder=out/csd-ci/builder
          test "$(git -C "$builder" rev-parse HEAD)" = 4d5504bbedf076f824c952f4ab198d09547c8c3c
          mkdir -p "$builder/.git/info"
          printf '* -text\n' > "$builder/.git/info/attributes"
          git -C "$builder" checkout-index --all --force
          git -C "$builder" update-index --refresh
      - name: Static policy and source tests
        run: |
          sudo apt-get -q update
          sudo apt-get -q -y install python3-yaml
          /usr/bin/python3 Tests/csd-review-input-checks.py
          /usr/bin/python3 Tests/robin-source-checks.py
          /usr/bin/python3 Tests/csd-package-checks.py
          /usr/bin/python3 Tests/csd-provenance-checks.py
          /usr/bin/python3 Tests/csd-ci-checks.py
          /usr/bin/python3 Tests/custom-source-checks.py
          /usr/bin/python3 Tests/release-producer-checks.py
          /usr/bin/python3 Tests/csd-source-checks.py
          /usr/bin/python3 Tests/csd-final-review-checks.py
          /usr/bin/python3 Tests/csd-postprepare-checks.py
      - name: Prepare Debian13 build and consumption image; inventory before compilation
        id: container
        run: bash .github/scripts/csd-review-host.sh prepare
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: sdk-cache
        with:
          path: out/csd-ci/sdk
          key: ${{ steps.container.outputs.cache_key }}
      - name: Build or verify exact custom SDK
        env:
          SDK_CACHE_HIT: ${{ steps.sdk-cache.outputs.cache-hit }}
        run: bash .github/scripts/csd-review-host.sh sdk
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.sdk-cache.outputs.cache-hit != 'true' && github.repository == 'danjboyd/gnustep-performance-dashboard' && (github.event_name == 'workflow_dispatch')
        with:
          path: out/csd-ci/sdk
          key: ${{ steps.container.outputs.cache_key }}
      - name: Same-SDK theme receipt and unsigned AppImage; hard CSD and dependency gates
        run: bash .github/scripts/csd-review-host.sh review
      - name: Keep unsigned review only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custom-csd-unsigned-${{ inputs.mode }}
          path: dist/ci/csd-review
          if-no-files-found: error
          retention-days: 7
      - name: Keep inventory and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custom-csd-review-evidence
          path: |
            out/csd-ci/container-inputs.json
            out/csd-ci/logs
            Tests/out
            dist/logs
          if-no-files-found: warn
          retention-days: 7
