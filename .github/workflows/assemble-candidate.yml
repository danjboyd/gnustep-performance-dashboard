name: Assemble Linux and Windows candidate

# This workflow only creates a review artifact. The two producers must have
# built this exact checkout commit, and both must supply corresponding sources.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version matching both producer artifacts
        required: true
        default: 0.1.1-rc1
      linux-run-id:
        description: Successful Linux packaging run for this exact commit
        required: true
      windows-run-id:
        description: Successful Windows packaging run for this exact commit
        required: true
      windows-artifact-name:
        description: Windows artifact containing MSI, ZIP, provenance, feed and sources
        required: true
        default: windows-packages

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require successful producers at this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_RUN_ID: ${{ inputs.linux-run-id }}
          WINDOWS_RUN_ID: ${{ inputs.windows-run-id }}
        run: |
          for run_id in "$LINUX_RUN_ID" "$WINDOWS_RUN_ID"; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'Invalid producer run ID'; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$RUNNER_TEMP/producer.json"
            python3 - "$RUNNER_TEMP/producer.json" <<'PY'
          import json, os, sys
          run = json.load(open(sys.argv[1]))
          if (run['status'] != 'completed' or run['conclusion'] != 'success'
                  or run['head_sha'] != os.environ['GITHUB_SHA']):
              raise SystemExit('Producer must have succeeded at the exact candidate commit')
          print('Verified producer:', run['html_url'])
          PY
          done
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist/ci/linux
          run-id: ${{ inputs.linux-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.windows-artifact-name }}
          path: dist/ci/windows
          run-id: ${{ inputs.windows-run-id }}
          github-token: ${{ github.token }}
      - name: Verify both platforms and stage candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/assemble-release.py --input dist/ci/linux --input dist/ci/windows \
            --output dist/ci/candidate --version "$VERSION" --commit "$GITHUB_SHA" \
            --require-backend appimage --require-backend msi
          cat dist/ci/candidate/assembly.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: combined-candidate
          path: dist/ci/candidate
          if-no-files-found: error
          retention-days: 7
